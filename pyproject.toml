[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "joshuaende-multinode_bandwidth_bottleneck_grouping"
version = "0.1.0"
description = "按结构键把条目聚类，标出知识图谱构建工程师·多机通信的带宽瓶颈上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "joshuaende" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://joshuaende.github.io"
Repository = "https://github.com/joshuaende/multinode_bandwidth_bottleneck_grouping"
Issues = "https://github.com/joshuaende/multinode_bandwidth_bottleneck_grouping/issues"

[project.scripts]
multinode_bandwidth_bottleneck_grouping = "multinode_bandwidth_bottleneck_grouping:main"

[tool.setuptools]
py-modules = ["multinode_bandwidth_bottleneck_grouping"]
